{{- if include "network-monitor.influxdb.createSecret" . -}}
{{- $secretName := include "network-monitor.influxdb.secretName" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $tokenKey := .Values.influxdb.secretKeys.token | default "token" -}}
{{- $adminUserKey := .Values.influxdb.secretKeys.adminUser | default "admin-user" -}}
{{- $adminPasswordKey := .Values.influxdb.secretKeys.adminPassword | default "admin-password" -}}
{{- $token := .Values.influxdb.token -}}
{{- if not $token -}}
  {{- if and $existingSecret $existingSecret.data (index $existingSecret.data $tokenKey) -}}
    {{- $token = index $existingSecret.data $tokenKey | b64dec -}}
  {{- else -}}
    {{- $token = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "network-monitor.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $tokenKey }}: {{ $token | b64enc | quote }}
  {{- if .Values.influxdb.embedded.enabled }}
  {{- $adminUser := .Values.influxdb.embedded.adminUser | default "admin" }}
  {{- $adminPassword := .Values.influxdb.embedded.adminPassword }}
  {{- if not $adminPassword }}
    {{- if and $existingSecret $existingSecret.data (index $existingSecret.data $adminPasswordKey) }}
      {{- $adminPassword = index $existingSecret.data $adminPasswordKey | b64dec }}
    {{- else }}
      {{- $adminPassword = randAlphaNum 24 }}
    {{- end }}
  {{- end }}
  {{ $adminUserKey }}: {{ $adminUser | b64enc | quote }}
  {{ $adminPasswordKey }}: {{ $adminPassword | b64enc | quote }}
  {{- end }}
{{- end }}
